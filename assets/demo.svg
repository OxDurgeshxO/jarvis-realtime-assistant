<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#02060D"/>
    </linearGradient>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00A8FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#001833" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#00F0FF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Corner Tech HUD Accents -->
  <path d="M 40 80 L 40 40 L 80 40" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 1160 80 L 1160 40 L 1120 40" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 40 550 L 40 590 L 80 590" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 1160 550 L 1160 590 L 1120 590" fill="none" stroke="#00F0FF" stroke-width="3"/>

  <!-- Header & Title -->
  <text x="600" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#cyanText)" letter-spacing="4" filter="url(#neonGlow)">
    J.A.R.V.I.S. REALTIME AI COCKPIT
  </text>
  <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="18" fill="#88A0C0" letter-spacing="2">
    SUB-200ms FULL-DUPLEX BIDIRECTIONAL MULTIMODAL ASSISTANT
  </text>

  <!-- Center Glowing Arc Reactor -->
  <g transform="translate(600, 310)">
    <!-- Outer Glow Aura -->
    <circle r="140" fill="url(#reactorGlow)"/>

    <!-- Concentric Target Rings -->
    <circle r="120" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.5"/>
    <circle r="95" fill="none" stroke="#00A8FF" stroke-width="2" opacity="0.7"/>
    <circle r="75" fill="none" stroke="#00F0FF" stroke-width="3" stroke-dasharray="24 12" filter="url(#neonGlow)"/>
    <circle r="50" fill="#031024" stroke="#00F0FF" stroke-width="2"/>
    <circle r="25" fill="#00F0FF" filter="url(#neonGlow)"/>

    <!-- 10 Reactor Segment Blades -->
    <g stroke="#00F0FF" stroke-width="3" opacity="0.8">
      <line x1="0" y1="-85" x2="0" y2="-105"/>
      <line x1="50" y1="-69" x2="62" y2="-85"/>
      <line x1="81" y1="-26" x2="100" y2="-32"/>
      <line x1="81" y1="26" x2="100" y2="32"/>
      <line x1="50" y1="69" x2="62" y2="85"/>
      <line x1="0" y1="85" x2="0" y2="105"/>
      <line x1="-50" y1="69" x2="-62" y2="85"/>
      <line x1="-81" y1="26" x2="-100" y2="32"/>
      <line x1="-81" y1="-26" x2="-100" y2="-32"/>
      <line x1="-50" y1="-69" x2="-62" y2="-85"/>
    </g>
  </g>

  <!-- Telemetry Left Module -->
  <g transform="translate(140, 230)">
    <rect width="240" height="180" rx="12" fill="#071326" stroke="#1A3358" stroke-width="1.5"/>
    <text x="20" y="35" font-family="monospace" font-size="14" fill="#00F0FF" font-weight="bold">TELEMETRY STATS</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#1A3358" stroke-width="1"/>
    
    <text x="20" y="78" font-family="monospace" font-size="12" fill="#88A0C0">ROUNDTRIP LATENCY:</text>
    <text x="220" y="78" text-anchor="end" font-family="monospace" font-size="13" fill="#00FF66" font-weight="bold">&lt; 142ms</text>

    <text x="20" y="108" font-family="monospace" font-size="12" fill="#88A0C0">AUDIO CAPTURE:</text>
    <text x="220" y="108" text-anchor="end" font-family="monospace" font-size="13" fill="#00F0FF">16kHz PCM</text>

    <text x="20" y="138" font-family="monospace" font-size="12" fill="#88A0C0">FPS RENDERING:</text>
    <text x="220" y="138" text-anchor="end" font-family="monospace" font-size="13" fill="#00FF66">60.0 FPS</text>

    <text x="20" y="165" font-family="monospace" font-size="12" fill="#88A0C0">VAD INTERRUPT:</text>
    <text x="220" y="165" text-anchor="end" font-family="monospace" font-size="13" fill="#FFB703" font-weight="bold">ACTIVE</text>
  </g>

  <!-- Pipeline Right Module -->
  <g transform="translate(820, 230)">
    <rect width="240" height="180" rx="12" fill="#071326" stroke="#1A3358" stroke-width="1.5"/>
    <text x="20" y="35" font-family="monospace" font-size="14" fill="#00F0FF" font-weight="bold">PIPELINE CORE</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#1A3358" stroke-width="1"/>
    
    <text x="20" y="78" font-family="monospace" font-size="12" fill="#88A0C0">LLM REASONING:</text>
    <text x="220" y="78" text-anchor="end" font-family="monospace" font-size="13" fill="#00F0FF">Gemini 2.0</text>

    <text x="20" y="108" font-family="monospace" font-size="12" fill="#88A0C0">VOICE SYNTHESIS:</text>
    <text x="220" y="108" text-anchor="end" font-family="monospace" font-size="13" fill="#00F0FF">Edge-TTS Neural</text>

    <text x="20" y="138" font-family="monospace" font-size="12" fill="#88A0C0">TRANSCRIPTION:</text>
    <text x="220" y="138" text-anchor="end" font-family="monospace" font-size="13" fill="#00F0FF">Whisper STT</text>

    <text x="20" y="165" font-family="monospace" font-size="12" fill="#88A0C0">PROTOCOL:</text>
    <text x="220" y="165" text-anchor="end" font-family="monospace" font-size="13" fill="#FFB703">WebSocket Duplex</text>
  </g>

  <!-- Audio Waveform Visualizer at Bottom -->
  <g transform="translate(200, 480)" opacity="0.8">
    <path d="M 0 30 Q 50 10, 100 30 T 200 30 T 300 15 T 400 45 T 500 20 T 600 35 T 700 25 T 800 30" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neonGlow)"/>
    <path d="M 0 30 Q 50 45, 100 30 T 200 25 T 300 40 T 400 15 T 500 35 T 600 20 T 700 35 T 800 30" fill="none" stroke="#7000FF" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Footer Tags -->
  <g transform="translate(600, 575)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#507090" letter-spacing="1">
      FASTAPI • WEBSOCKETS • AUDIOWORKLET • GEMINI LIVE API • REACT 18 • DOCKER
    </text>
  </g>
</svg>
